abstract: |
  This is version 3 of a pre-registered, independent Monte Carlo verification of orientation-clustering claims associated with the Buildreps database of approximately 1,159 ancient pyramids and temples. 
  Version 2 of this report (deposited 1 June 2026) found apparent clustering at two of five proposed paleopole latitudes — Pole II (76°N) and Pole III (72.2°N) — surviving all four pre-registered and 
  exploratory null models tested, and characterised that clustering as robust. Post-publication review identified two assumptions that result rested on and that none of the null models had tested: 
  that the five pole latitudes were targets fixed before the data were seen (when they were partly identified from the orientation data), and that the 994 structures are independent observations 
  (when many belong to dense single-tradition spatial clusters). With both controls applied, the per-pole clustering at Poles II and III is not distinguishable from chance. Under the assumption-free 
  conditional null with a latitude look-elsewhere correction, the corrected p-values are 0.999 and 0.90; under a spatial-cluster null collapsing nearby structures to one unit each, both poles 
  return p = 1.0 at every linkage threshold from 25 to 100 km. The 119 site-level contributors to the Pole III window reduce to 25 independent clusters, the largest a single 29-site Mesoamerican 
  cluster in the northern Yucatán. The pre-registered aggregate test statistic, formally significant at p = 0.0001 under the unconditional null, was shown in version 2 to be an artifact of 
  hemisphere-selection; this finding is unchanged. A descriptive finding from the longitude scan also stands: the 47°W meridian is rank 10 of 72 most-clustered meridians in the observed data, 
  with the natural attractor at −20°E. The corrected conclusion is that no proposed pole shows clustering distinguishable from chance. The framework's broader interpretive claim — that the 
  observed concentrations represent former positions of Earth's rotational axis — is not tested by an orientation-clustering analysis and would require independent geological evidence in any case; 
  this report's contribution to that claim is only to remove the orientation-clustering signal that had been offered as evidence for it.

